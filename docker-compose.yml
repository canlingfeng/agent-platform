# ============================================================
# agent_platform · app + mysql 编排
# 用法：cp .env.example .env 填值 → docker compose up -d --build
# ============================================================
services:
  db:
    image: mysql:8.4                 # 与本机 8.4.11 LTS 同大版本
    container_name: agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agent_platform
      MYSQL_USER: ${AGENT_DB_USER}        # 官方镜像自动建用户并授权该库
      MYSQL_PASSWORD: ${AGENT_DB_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql                                  # 数据持久化
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro   # 首次启动自动建表
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # ⚠️ 默认注释：你本机已装了 MySQL 占着 3306，映射会报 port already allocated。
    # app 容器走服务名 db 访问，不需要宿主端口；只有想用 Navicat 连容器库时才打开。
    # 新（改为启用，用 13306 避开本机 3306）：
    ports:
      - "127.0.0.1:13306:3306"
  app:
    build: .
    container_name: agent_app
    restart: unless-stopped
    environment:
      # 关键：容器间用【服务名】寻址，不能写 127.0.0.1（那是容器自己）
      AGENT_DB_HOST: db
      AGENT_DB_PORT: "3306"
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      AGENT_DB_NAME: agent_platform
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY}
      # 向量化 / 重排序（RAG）。容器内没有 config.json（.dockerignore 排除），
      # 密钥只能走环境变量；未设置时 compose 会替换成空串，RAG 功能随即不可用。
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
      # MCP（可选）：JSON 字符串用单引号包住 ${...}，避免值以 [ 开头时被 YAML 解析成数组。
      # 默认值用 [] 而非空串：空串会让 json.loads("") 抛 JSONDecodeError，
      # [] 则让 _load_servers() / _mcp_allow() 走正常路径（无 server / 全拒）。
      AGENT_MCP_SERVERS: '${AGENT_MCP_SERVERS:-[]}'
      AGENT_MCP_ALLOW: '${AGENT_MCP_ALLOW:-[]}'
      # 连接批次硬上限（秒）：与 _connect_timeout() 的默认值 5.0 保持一致。
      # 用 :- 而非 -：宿主未设置或设为空串时都回退 5.0，避免空串流入 float() 抛 ValueError。
      # 单引号保证它是 YAML 字符串标量；值最终以字符串形式进入容器进程环境块。
      AGENT_MCP_CONNECT_TIMEOUT: '${AGENT_MCP_CONNECT_TIMEOUT:-5.0}'
      # 单次请求 token 上限：与 api/chat.py 的 _DEFAULT_MAX_TOKENS_PER_REQUEST(20000) 一致。
      # 实际生效值 = min(该值, 今日剩余额度)；容器里没有 config.json，只能靠环境变量注入。
      AGENT_MAX_TOKENS_PER_REQUEST: '${AGENT_MAX_TOKENS_PER_REQUEST:-20000}'
    ports:
      - "8000:8000"
    # 前端热更新：把本地 static/ 只读挂进容器。改完前端浏览器强刷即可生效，
    # 不用重建镜像（镜像里烘进去的那份会被这个挂载遮住，两者内容一致时无差别）。
    volumes:
      - ./static:/app/static:ro

    depends_on:
      db:
        condition: service_healthy   # 等 MySQL 真就绪再起 app，避免启动即崩
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
     - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
  # ---------- Milvus 向量库（standalone）----------
  # 单机部署：本地存储（storageType=local），不需要 MinIO 对象存储
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.27
    # 列表形式（exec form）：不需要 shell 解析，参数不会被意外展开
    command: ["milvus", "run", "standalone"]
    # Milvus 用到的部分系统调用被 Docker 默认 seccomp 策略拦截，需显式关闭
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379      # 元数据服务：服务名 + 端口
      COMMON_STORAGETYPE: local      # 本地存储：数据落 milvus_data 卷，免去 MinIO 依赖
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"                # 客户端访问口（pymilvus 连这个）
      - "9091:9091"                  # Milvus WebUI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s              # 启动慢：前 90 秒内的失败不计入
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy   # 等 etcd 健康检查通过

volumes:
  mysql_data:
  etcd_data:
  milvus_data: