# ============================================================
# agent_platform · app + mysql 编排
# 用法：cp .env.example .env 填值 → docker compose up -d --build
# ============================================================
services:
  db:
    image: mysql:8.4                 # 与本机 8.4.11 LTS 同大版本
    container_name: agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agent_platform
      MYSQL_USER: ${AGENT_DB_USER}        # 官方镜像自动建用户并授权该库
      MYSQL_PASSWORD: ${AGENT_DB_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql                                  # 数据持久化
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro   # 首次启动自动建表
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # ⚠️ 默认注释：你本机已装了 MySQL 占着 3306，映射会报 port already allocated。
    # app 容器走服务名 db 访问，不需要宿主端口；只有想用 Navicat 连容器库时才打开。
    # 新（改为启用，用 13306 避开本机 3306）：
    ports:
      - "127.0.0.1:13306:3306"
  app:
    build: .
    container_name: agent_app
    restart: unless-stopped
    environment:
      # 关键：容器间用【服务名】寻址，不能写 127.0.0.1（那是容器自己）
      AGENT_DB_HOST: db
      AGENT_DB_PORT: "3306"
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      AGENT_DB_NAME: agent_platform
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
    ports:
      - "8000:8000"
    # 前端热更新：把本地 static/ 只读挂进容器。改完前端浏览器强刷即可生效，
    # 不用重建镜像（镜像里烘进去的那份会被这个挂载遮住，两者内容一致时无差别）。
    volumes:
      - ./static:/app/static:ro

    depends_on:
      db:
        condition: service_healthy   # 等 MySQL 真就绪再起 app，避免启动即崩
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
     - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- Milvus 向量库（standalone）----------
  # 依赖 etcd（元数据）+ minio（对象存储），两者健康后才启动
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.27
    # 列表形式（exec form）：不需要 shell 解析，参数不会被意外展开
    command: ["milvus", "run", "standalone"]
    # Milvus 用到的部分系统调用被 Docker 默认 seccomp 策略拦截，需显式关闭
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379      # 元数据服务：服务名 + 端口
      MINIO_ADDRESS: minio:9000      # 对象存储：MinIO 的 S3 API 端口是 9000（不是 9090）
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"                # 客户端访问口（pymilvus 连这个）
      - "9091:9091"                  # Milvus WebUI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s              # 启动慢：前 90 秒内的失败不计入
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy   # 等 etcd 健康检查通过
      minio:
        condition: service_healthy   # 等 minio 健康检查通过

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data: